<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pip-compact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #000; --fg: #ececec; --mid: #8a8a8a; --dim: #4a4a4a; --line: #242424; --bubble: #141414; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 15px; line-height: 1.5;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  }
  header h1 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: 0.02em; }
  #status { font-size: 12px; color: var(--mid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #log {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
    max-width: 760px; width: 100%; margin: 0 auto;
  }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.you { align-self: flex-end; background: var(--fg); color: var(--bg); border-bottom-right-radius: 4px; }
  .msg.pip { align-self: flex-start; background: var(--bubble); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.sys { align-self: center; color: var(--mid); font-size: 13px; }
  .empty { margin: auto; color: var(--dim); text-align: center; font-size: 14px; }
  form {
    border-top: 1px solid var(--line); padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
    display: flex; gap: 10px; max-width: 760px; width: 100%; margin: 0 auto;
  }
  #input {
    flex: 1; min-width: 0; background: var(--bg); color: var(--fg);
    border: 1px solid var(--dim); border-radius: 999px; padding: 10px 16px; font: inherit; outline: none;
  }
  #input:focus { border-color: var(--mid); }
  #input::placeholder { color: var(--dim); }
  button {
    background: var(--fg); color: var(--bg); border: 0; border-radius: 999px;
    padding: 10px 18px; font: inherit; font-weight: 700; cursor: pointer;
  }
  button:disabled { background: var(--dim); color: var(--bg); cursor: default; }
  @media (max-width: 480px) {
    body { font-size: 14px; }
    .msg { max-width: 90%; }
    header, #log, form { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>
<body>

<header>
  <h1>pip-compact</h1>
  <div id="status">connecting...</div>
</header>

<div id="log">
  <div class="empty" id="empty">A ~125M parameter transformer. Replies come from the local server.</div>
</div>

<form id="form" autocomplete="off">
  <input id="input" type="text" placeholder="Message Pip" maxlength="400" aria-label="Message Pip">
  <button id="send" type="submit" disabled>Send</button>
</form>

<script>
(() => {
  const logEl = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const statusEl = document.getElementById('status');
  let emptyEl = document.getElementById('empty');
  let busy = false;

  function addMsg(cls, text) {
    if (emptyEl) { emptyEl.remove(); emptyEl = null; }
    const d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.textContent = text;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
    return d;
  }

  async function loadStatus() {
    try {
      const res = await fetch('/api/status');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const s = await res.json();
      statusEl.textContent = 'pip-compact | ' + (s.params ? (s.params / 1e6).toFixed(0) + 'M params' : 'ready');
      sendBtn.disabled = false;
    } catch (e) {
      statusEl.textContent = 'no model server';
      addMsg('sys', 'No model is connected to this page yet, so Pip cannot reply.');
    }
  }

  async function send() {
    const msg = input.value.trim();
    if (!msg || busy) return;
    input.value = '';
    busy = true;
    sendBtn.disabled = true;
    addMsg('you', msg);
    const node = addMsg('pip', '');
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg }),
      });
      if (!res.ok) { node.textContent = '[HTTP ' + res.status + ']'; return; }
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
          const block = buf.slice(0, i);
          buf = buf.slice(i + 2);
          let ev = 'message', data = '';
          for (const line of block.split('\n')) {
            if (line.startsWith('event: ')) ev = line.slice(7);
            else if (line.startsWith('data: ')) data += line.slice(6);
          }
          if (!data) continue;
          const d = JSON.parse(data);
          if (ev === 'token') node.textContent += d.text;
          else if (ev === 'error') node.textContent += '\n[error: ' + d.message + ']';
        }
        logEl.scrollTop = logEl.scrollHeight;
      }
    } catch (e) {
      node.textContent += '[could not reach the model: ' + e.message + ']';
    } finally {
      busy = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener('submit', (e) => { e.preventDefault(); send(); });
  loadStatus();
  input.focus();
})();
</script>
</body>
</html>
